name: ELEVA | Actualizar y publicar
on:
  push:
    branches: [main]
  schedule:
    # Horarios en UTC equivalentes a America/Lima (UTC-5, sin horario de verano).
    # Evita depender de la interpretación de timezone del programador.
    - cron: '41 10 * * *' # 05:41 Lima
    - cron: '17 11 * * *' # 06:17 Lima
    - cron: '53 11 * * *' # 06:53 Lima
    - cron: '29 12 * * *' # 07:29 Lima
    - cron: '19 13 * * *' # 08:19 Lima
    - cron: '47 14 * * *' # 09:47 Lima
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eleva-publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sincronizar main antes de recopilar (evitar commits historicos divergentes)
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Recopilar RSS de medios y fuentes seleccionadas
        run: python collector.py
      - name: Recuperar modelos abiertos de traducción
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: eleva-argos-translate-2026-v2
      - name: Instalar traductor local gratuito
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -q argostranslate==1.9.6
      - name: Traducción automática opcional al español (sin API comercial)
        continue-on-error: true
        run: timeout 850s python translate_offline.py
      - name: Vincular publicaciones a acontecimientos candidatos
        run: python enrich.py
      - name: Actualizar seguimiento temático e histórico
        run: python seguimiento.py
      - name: Verificar generación de noticias de hoy en Lima
        run: python verificar_frescura.py
      - name: Validar sintaxis de la interfaz
        run: node --check app.js
      - name: Tests internos
        run: python -m unittest discover -s tests -q
      - name: Conservar nuevas entradas e histórico
        run: |
          git config user.name 'eleva-actualizador'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "ELEVA fuentes e historial $(date -u '+%Y-%m-%dT%H:%MZ')"
            # Pueden llegar commits mientras el lector RSS trabaja.
            # Reintentar con rebase; nunca forzar cambios de historial.
            saved=0
            for retry in 1 2 3; do
              if git push origin HEAD:main; then
                saved=1
                break
              fi
              echo "ELEVA: hubo cambios en main; intento de integración $retry/3"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Conflicto en el histórico. No se forzará la publicación."
                exit 1
              fi
            done
            if [ "$saved" -ne 1 ]; then
              echo "::error::No se pudo guardar el histórico tras tres intentos."
              exit 1
            fi
          fi
      - name: Preparar versión pública
        run: |
          mkdir -p site/data
          cp index.html style.css app.js sources.json editorial.json .nojekyll site/
          cp -R data/. site/data/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4